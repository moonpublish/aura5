      const [selectedTrainer, setSelectedTrainer] = useState(null);
      const [selectedTimeSlot, setSelectedTimeSlot] = useState(null);
      const [badmintonMode, setBadmintonMode] = useState('double');

        window.scrollTo({ top: 0, behavior: 'instant' });
        setSelectedVenue(v);

      const calculatePrice = () => {
        if (!selectedVenue) return { venueShare: 0, trainerFee: 0, total: 0 };
        let venueShare = 0;
        if (selectedVenue.type === 'private') {
          if (selectedSport === 'badminton') {
            const players = badmintonMode === 'double' ? 4 : 2;
            venueShare = Math.round((selectedVenue.baseCost / players) * 1.6);
          } else {
            venueShare = Math.round((selectedVenue.baseCost / 6) * 1.6);
          }
        }
        const trainerFee = (bookingOption === 'with_trainer' && selectedTrainer) ? selectedTrainer.rate : 0;
        return { venueShare, trainerFee, total: venueShare + trainerFee };
      };

      const prices = calculatePrice();

          showToast('กรุณาเลือกสถานที่และช่วงเวลาที่ต้องการจอง', 'warning');

                  key={i} 
                  className={`p-5 rounded-3xl border flex flex-col justify-between space-y-4 group transition-all ${
                    isDark 
                      ? 'bg-slate-800/80 border-slate-700 hover:border-lime-400 hover:shadow-xl' 
                      : 'bg-slate-50 border-slate-300 hover:border-indigo-400 hover:shadow-lg'
                  }`}
                >
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-black text-slate-950 bg-lime-400 px-2.5 py-0.5 rounded-full">
                        {prod.tag}
                      </span>
                      <span className="text-xs font-bold text-emerald-400 flex items-center gap-1">
                        <Icon name="zap" className="w-3 h-3 text-emerald-400" /> จัดส่งใน 1 ชม.
                      </span>
                    </div>

                    <div>
                      <h4 className={`text-sm font-extrabold group-hover:text-lime-400 transition-colors leading-snug ${isDark ? 'text-white' : 'text-slate-900'}`}>{prod.name}</h4>
                      <p className={`text-[11px] font-semibold mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-600'}`}>{prod.detail}</p>
                    </div>

                    <div className={`p-3 rounded-2xl border text-xs space-y-1 ${
                      isDark ? 'bg-slate-950/70 border-slate-700' : 'bg-white border-slate-200'
                    }`}>
                      <div className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-1">
                        <Icon name="shieldCheck" className="w-3.5 h-3.5 text-lime-400" /> สรรพคุณทางยา & การออกฤทธิ์:
                      </div>
                      <p className={`text-[11px] leading-relaxed font-medium ${isDark ? 'text-slate-200' : 'text-slate-700'}`}>
                        {prod.properties}
                      </p>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-700/50 flex flex-col space-y-2">
                    <div className="text-lg font-black text-lime-400">{prod.price}</div>
                    <button 
                      onClick={() => handleAddToCart(prod.name)}
                      className="w-full py-2.5 bg-lime-400 hover:bg-lime-500 text-slate-950 text-xs font-black rounded-xl transition-all shadow-md flex items-center justify-center gap-1.5"
                    >
                      <Icon name="shoppingCart" className="w-3.5 h-3.5" /> สั่งซื้อส่งด่วนถึงบ้าน (1 ชม.)
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. TELEMEDICINE & DOCTOR APPOINTMENT VIEW (Redesigned as Right Screen in Image)
    // ==========================================
    function TelemedicineView({ theme, showToast }) {
      const isDark = theme === 'dark';
      const [messages, setMessages] = useState([
        { sender: 'ai', text: 'สวัสดีครับคุณศิรินทร์ ผมคือระบบคัดกรองอาการเบื้องต้น Aura AI ปัจจุบันคุณมีอาการไม่สบายหรือต้องการปรึกษาแพทย์เฉพาะทางด้านใดครับ?' }
      ]);
      const [input, setInput] = useState('');
      const [appointmentModal, setAppointmentModal] = useState(false);
      const [appointmentType, setAppointmentType] = useState('visit'); // 'visit' | 'virtual'
      const [activeDate, setActiveDate] = useState('14 Tue');
      const [activeTime, setActiveTime] = useState('13:00');

      const handleSend = () => {
        if (!input.trim()) return;
        const text = input;
        setMessages(prev => [...prev, { sender: 'user', text }]);
        setInput('');

        setTimeout(() => {
          setMessages(prev => [
            ...prev,
            { sender: 'ai', text: 'ประเมินจากอาการที่ระบุ จัดอยู่ในกลุ่มสีเขียว (ความรุนแรงต่ำ) หากต้องการนัดหมายแพทย์เฉพาะทาง คุณสามารถกดปุ่ม "Make an Appointment" กับ พญ. เอมิลี่ ปีเตอร์สัน ได้ทันทีครับ' }
          ]);
        }, 600);
      };

      return (
        <div className="space-y-6 animate-fadeIn">
          
          {/* Main Appointment Hero Card (Right Screen in Image) */}
          <div className="bg-gradient-to-b from-[#2B47FC] via-[#3730A3] to-[#1E1B4B] rounded-3xl p-6 text-white shadow-2xl border border-white/20 relative space-y-6">
            
            {/* Top Navigation */}
            <div className="flex items-center justify-between">
              <button className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                <Icon name="chevronLeft" className="w-4 h-4" />
              </button>
              <span className="text-xs font-bold italic tracking-wide text-indigo-100">Make an Appointment</span>
              <button className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-rose-400">
                <Icon name="heart" className="w-4 h-4" />
              </button>
            </div>

            {/* Doctor Profile Banner */}
            <div className="flex items-center justify-between gap-4">
              <div>
                <span className="text-xs font-medium text-indigo-200">Cardiologist</span>
                <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5">
                  Emily<br />Peterson
                </h2>
                <div className="flex items-center gap-1.5 mt-2">
                  <span className="w-2 h-2 rounded-full bg-lime-400 animate-pulse"></span>
                  <span className="text-xs text-lime-400 font-bold">Online</span>
                </div>
              </div>

              <div className="relative">
                <img 
                  src="https://images.unsplash.com/photo-1594824813583-36c1e57c6b90?auto=format&fit=crop&q=80&w=260" 
                  alt="Dr Emily Peterson" 
                  className="w-32 h-32 sm:w-36 sm:h-36 rounded-3xl object-cover border-2 border-white/30 shadow-2xl"
                />
              </div>
            </div>

            {/* Doctor Stats Strip */}
            <div className="flex items-center justify-between p-3 rounded-2xl bg-white/10 backdrop-blur-md text-xs font-semibold">
              <div className="flex items-center gap-1.5">
                <Icon name="calendar" className="w-4 h-4 text-indigo-300" />
                <span>Book</span>
              </div>
              <div className="flex items-center gap-1 text-amber-300">
                <span>⭐</span>
                <span>4.8</span>
              </div>
              <div className="flex items-center gap-1 text-lime-400">
                <span>💰</span>
                <span>$25</span>
              </div>
              <div className="text-indigo-200">+30 reviews</div>
            </div>

            {/* Appointment Booking Panel (White Card as in image) */}
            <div className="bg-white text-slate-900 rounded-3xl p-5 shadow-xl space-y-4">
              
              {/* Visit vs Virtual Toggle */}
              <div className="grid grid-cols-2 gap-2">
                <button 
                  onClick={() => setAppointmentType('visit')}
                  className={`py-2.5 px-4 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 transition-all ${
                    appointmentType === 'visit' 
                      ? 'bg-slate-900 text-white shadow-md' 
                      : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  <Icon name="calendar" className="w-4 h-4" />
                  <span>Visit</span>
                </button>
                <button 
                  onClick={() => setAppointmentType('virtual')}
                  className={`py-2.5 px-4 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 transition-all ${
                    appointmentType === 'virtual' 
                      ? 'bg-slate-900 text-white shadow-md' 
                      : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  <Icon name="camera" className="w-4 h-4" />
                  <span>Virtual</span>
                </button>
              </div>

              {/* Day Pills (12 Sun, 13 Mon, 14 Tue, 15 Wed) */}
              <div className="flex items-center justify-between gap-1 overflow-x-auto text-xs">
                {['12 Sun', '13 Mon', '14 Tue', '15 Wed', '16 Thu'].map(d => (
                  <button
                    key={d}
                    onClick={() => setActiveDate(d)}
                    className={`py-2 px-3 rounded-xl font-bold whitespace-nowrap transition-all ${
                      activeDate === d 
                        ? 'bg-lime-400 text-slate-950 shadow-md scale-105' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {d}
                  </button>
                ))}
              </div>

              {/* Time Slots (10:00, 11:00, 12:00, 13:00 Neon Active, 14:00) */}
              <div className="flex items-center justify-between gap-1 overflow-x-auto text-xs">
                {['10:00', '11:00', '12:00', '13:00', '14:00'].map(t => (
                  <button
                    key={t}
                    onClick={() => setActiveTime(t)}
                    className={`py-2 px-3 rounded-xl font-bold whitespace-nowrap transition-all ${
                      activeTime === t 
                        ? 'bg-lime-400 text-slate-950 shadow-md scale-105' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {t}
                  </button>
                ))}
              </div>

              {/* Main Action Appointment Pill */}
              <button 
                onClick={() => showToast(`นัดหมายแพทย์สำเร็จ: ${activeDate} เวลา ${activeTime} น. 🩺`)}
                className="w-full py-3.5 px-6 rounded-full bg-slate-900 text-white font-black text-xs shadow-xl flex items-center justify-between gap-4 hover:bg-slate-800 transition-all"
              >
                <span className="w-6 h-6 rounded-full bg-white text-slate-900 flex items-center justify-center">
                  <Icon name="check" className="w-3.5 h-3.5 stroke-[3]" />
                </span>
                <span className="tracking-wide">Appointment</span>
                <span className="text-lime-400 font-extrabold">›››</span>
              </button>

            </div>

          </div>

          {/* AI Clinical Symptom Chat Assistant */}
          <div className={`p-6 rounded-3xl ${isDark ? 'glass-card-dark' : 'glass-card-light'} space-y-4`}>
            <div className="flex items-center gap-2 border-b border-white/10 pb-3">
              <span className="w-2.5 h-2.5 rounded-full bg-lime-400 animate-pulse"></span>
              <h3 className="text-sm font-bold text-white dark:text-white">
                <span className={isDark ? 'text-white' : 'text-slate-900'}>Aura Clinical AI Symptom Checker</span>
              </h3>
            </div>

            <div className="space-y-3 max-h-48 overflow-y-auto pr-1">
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[85%] p-3.5 rounded-2xl text-xs ${
                    m.sender === 'user' 
                      ? 'bg-lime-400 text-slate-950 font-bold' 
                      : 'bg-white/10 text-white'
                  }`}>
                    {m.text}
                  </div>
                </div>
              ))}
            </div>

            <div className="flex gap-2 pt-2 border-t border-white/10">
              <input 
                type="text" 
                placeholder="พิมพ์อธิบายอาการของคุณที่นี่..."
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                className="flex-1 text-xs px-4 py-2.5 rounded-2xl bg-white/10 border border-white/15 text-white placeholder-slate-400 focus:outline-none focus:border-lime-400"
              />
              <button 
                onClick={handleSend}
                className="px-4 py-2.5 rounded-2xl bg-lime-400 hover:bg-lime-500 text-slate-950 text-xs font-bold transition-all"
              >
                <Icon name="send" className="w-4 h-4" />
              </button>
            </div>
          </div>

        </div>
      );
    }

    // --- React 18 Resilient Mounting ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
